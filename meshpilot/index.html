<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ecefe9" />
    <link rel="icon" href="data:," />
    <title>MeshPilot 网格实验台</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">◈</span><div><strong>MeshPilot</strong><small>网格实验台</small></div></div>
      <a href="https://github.com/StevenssW/MeshPilot" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </header>
    <main>
      <div class="intro">
        <div><h1>网格简化与对比</h1><p>减面、压缩贴图，并在同步视角下检查导出效果。</p></div>
        <button type="button" id="sample">加载示例</button>
      </div>
      <div class="workspace">
        <section class="comparison" aria-label="模型对比">
          <div class="comparison-bar">
            <div class="file"><span id="model-name">扭结环</span><small id="model-kind">内置示例</small></div>
            <div class="tools"><button type="button" id="wire" aria-pressed="false">线框</button><button type="button" id="geometry" aria-pressed="false">仅看几何</button><button type="button" id="fit">重置视角</button></div>
          </div>
          <div class="stages">
            <figure><div class="stage" id="before"><span class="stage-label"><i></i><span id="before-label">原始网格</span></span></div><figcaption><strong id="before-count">—</strong><span>三角面</span><span class="vertices" id="before-vertices"></span></figcaption></figure>
            <figure><div class="stage result-stage" id="after"><span class="stage-label"><i></i><span id="after-label">简化结果</span></span></div><figcaption><strong id="after-count">—</strong><span>三角面</span><span class="vertices" id="after-vertices"></span></figcaption></figure>
          </div>
          <div class="comparison-foot"><span>拖动旋转 · 滚轮缩放 · 右键平移</span><span>视角同步</span></div>
          <section class="texture-panel" aria-labelledby="texture-title">
            <div class="texture-heading"><h2 id="texture-title">贴图压缩</h2><p id="texture-status" aria-live="polite">导入带贴图的 GLB 后可用。</p></div>
            <div class="texture-controls">
              <label for="texture-size">最长边</label>
              <select id="texture-size" disabled><option value="0">原始贴图</option><option value="512">512 px</option><option value="1024">1024 px</option><option value="2048">2048 px</option><option value="4096">4096 px</option></select>
              <label class="quality-control" for="texture-quality" title="用于不透明的颜色贴图。法线、材质数据和透明贴图使用 PNG。"><span>颜色质量</span><input id="texture-quality" type="range" min="40" max="100" value="85" disabled /><output id="texture-quality-value" for="texture-quality">85%</output></label>
              <button type="button" id="texture-preview" disabled>预览并应用</button>
              <button type="button" id="texture-compare" aria-pressed="false" disabled>对比贴图效果</button>
            </div>
            <details id="texture-details" hidden>
              <summary>查看贴图细节</summary>
              <label for="texture-map">贴图</label>
              <select id="texture-map"></select>
              <div class="texture-pair">
                <figure><img id="texture-original" alt="原始贴图" /><figcaption id="texture-original-info"></figcaption></figure>
                <figure><img id="texture-compressed" alt="压缩后的贴图" /><figcaption id="texture-compressed-info"></figcaption></figure>
              </div>
            </details>
          </section>
        </section>
        <aside aria-label="简化设置">
          <div class="controls">
            <label class="drop" id="drop" for="file"><span class="upload-icon" aria-hidden="true">↑</span><span><strong>导入模型</strong><small>点击或拖入 GLB、OBJ、STL</small></span></label>
            <input id="file" type="file" accept=".glb,.obj,.stl" class="visually-hidden" />
            <h2>简化设置</h2>
            <label class="field" for="ratio"><span>目标保留比例</span><output id="ratio-value" for="ratio">25%</output></label>
            <input id="ratio" type="range" min="1" max="100" value="25" />
            <label class="field" for="error"><span>误差上限</span><output id="error-value" for="error">1.0%</output></label>
            <input id="error" type="range" min="0" max="20" step="0.1" value="1" />
            <label class="check"><input id="appearance" type="checkbox" checked aria-describedby="appearance-help" />保护材质外观</label>
            <p class="field-help" id="appearance-help">将法线、纹理坐标等纳入减面误差。</p>
            <label class="check"><input id="surface" type="checkbox" checked aria-describedby="surface-help" />保护网格表面</label>
            <p class="field-help" id="surface-help">保留 UV 接缝拐点，在检测到异常的区域多留面。</p>
            <label class="check"><input id="border" type="checkbox" checked />保持开放边界</label>
            <button class="primary" id="run" type="button" disabled>运行简化</button>
          </div>
          <div class="summary">
            <h2>运行结果</h2>
            <dl><div><dt>三角面减少</dt><dd id="reduction">—</dd></div><div><dt id="error-label">实际误差</dt><dd id="actual-error">—</dd></div><div><dt>简化耗时</dt><dd id="elapsed">—</dd></div></dl>
            <button class="export" id="export" type="button" disabled>下载 GLB</button>
          </div>
        </aside>
      </div>
      <footer><p id="status" role="status" aria-live="polite">正在初始化 WebAssembly…</p><span>meshoptimizer 1.3.0 · 本地处理</span></footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
